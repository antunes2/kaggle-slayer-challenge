[project]
name = "slayer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabriel Antunes Lima", email = "gabrielantunes222@gmail.com" }
]
requires-python = ">=3.12.3"
dependencies = [
    "catboost>=1.2.10",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
]

[project.scripts]
slayer = "slayer.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["slayer"]
